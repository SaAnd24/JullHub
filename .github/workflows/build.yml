name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Localizar proyecto (o descomprimir el ZIP)
        id: locate
        run: |
          SETTINGS=$(find . -maxdepth 4 -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            ZIP=$(find . -maxdepth 3 -name "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -n "$ZIP" ]; then
              echo "Descomprimiendo $ZIP"
              mkdir -p /tmp/proj
              unzip -q "$ZIP" -d /tmp/proj
              SETTINGS=$(find /tmp/proj -maxdepth 4 -name settings.gradle.kts | head -n 1)
            fi
          fi
          if [ -z "$SETTINGS" ]; then
            echo "::error::No se encontró settings.gradle.kts. Estructura del repo:"
            find . -maxdepth 3 -not -path "./.git/*"
            exit 1
          fi
          DIR=$(realpath "$(dirname "$SETTINGS")")
          echo "Proyecto Gradle en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JullHub-debug
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
